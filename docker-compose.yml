services:
  app:
    build: .
    container_name: rag-chat-service
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3005}:${PORT:-3005}"

  db:
    image: postgres:16-alpine
    container_name: rag-chat-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_chat
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_chat"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:4.8.1
    container_name: rag-chat-adminer
    depends_on:
      db:
        condition: service_started
    ports:
      - "8081:8080"

volumes:
  postgres_data:
